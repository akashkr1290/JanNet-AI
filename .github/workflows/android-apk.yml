# JanNet AI - Android APK
#
# Builds the installable Android app (release APK) pointed at the live API
# and keeps it as a downloadable artifact. Flutter CI only builds a DEBUG APK
# without an API address, which a phone cannot use against the pilot.
#
# Runs on every release tag (v*.*.*) and on demand (Actions > Android APK >
# Run workflow), where another API address can be given.
#
# Signing: no upload keystore exists in this repository, so the APK is signed
# with the debug key (flutter/android/app/build.gradle.kts falls back to it).
# Fine for sideloading on pilot phones; NOT for a Play Store listing.
name: Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL compiled into the app"
        required: false
        type: string
        default: "https://jannet-api.jennetai129012.workers.dev/api/v1"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # Order: manual input, repo variable, then the pilot Worker URL.
      API_BASE_URL: ${{ inputs.api_base_url || vars.PRODUCTION_WEB_API_BASE_URL || 'https://jannet-api.jennetai129012.workers.dev/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        # Same SDK as flutter-ci.yml and docker/Dockerfile.flutter-android.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Set up Java 21
        # maplibre_gl 0.27 compiles its Android code for Java 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the API address
        run: |
          case "$API_BASE_URL" in
            https://*/api/v1) echo "API_BASE_URL=$API_BASE_URL" ;;
            *) echo "::error::API_BASE_URL must be https://.../api/v1 (got: $API_BASE_URL)"; exit 1 ;;
          esac

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: flutter
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Name the APK after the version
        id: apk
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          out="JanNetAI-${ref}-${GITHUB_SHA::7}.apk"
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "$out"
          ls -l "$out"
          sha256sum "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30
