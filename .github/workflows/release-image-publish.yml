# JanNet AI - Release Image Publish (Phase 21 - deployment pipeline
# preparation only)
#
# This is the CI/CD-side half of "deployment pipeline preparation" named
# in this phase's brief: on a version tag, build the two locked-stack
# service images that docker-build.yml already validated on every push,
# and publish them to GitHub Container Registry (GHCR) with a real,
# traceable version tag.
#
# What this workflow deliberately does NOT do, per this phase's explicit
# boundary ("do not create deployment behavior that belongs to Phase
# 22"): it does not target any server, cluster, or cloud environment; it
# does not touch `deployment/` (empty, reserved for Phase 22 per
# ARCHITECTURE.md Section 8's Phase -> Component map: "22 | deployment/");
# and it does not run on every push, only on an explicit version tag or a
# manual dispatch, so it can never fire as a side effect of ordinary CI.
# "Publish an image to a registry" and "deploy that image somewhere" are
# two different steps in any real pipeline - only the first belongs here.
name: Release Image Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# Audit fix Phase 07: image names are derived from the LOWERCASED repository
# path (GHCR rejects upper-case repository names, and this repository's name
# contains capitals); deployment/scripts/deploy.sh and ec2-user-data lowercase
# the same way.
jobs:
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    steps:
      - name: Derive lowercase image names
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=${repo}/backend" >> "$GITHUB_ENV"
          echo "AI_SERVICE_IMAGE=${repo}/ai-service" >> "$GITHUB_ENV"

      - name: Checkout (with Git LFS - trained YOLO weights, audit GAP-060)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN is the ambient, auto-rotated per-run token GitHub
          # Actions already provides - no separate registry credential was
          # created or hard-coded for this workflow.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build & push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AI_SERVICE_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.AI_SERVICE_IMAGE }}:latest
          cache-from: type=gha,scope=ai-service-image
          cache-to: type=gha,mode=max,scope=ai-service-image

  # Audit GAP-017 (SRS 11.1/11.2): the web frontend image served by nginx in
  # production (deployment/docker-compose.prod-override.yml). Flutter Web runs
  # in the browser, so the public API URL is compiled into the bundle at
  # build time: set the repository variable PRODUCTION_WEB_API_BASE_URL
  # (Settings > Secrets and variables > Actions > Variables), e.g.
  # https://jannet.example.org/api/v1 - the same domain nginx serves.
  # A separate job, so a missing variable fails only this job (loudly) and
  # never blocks the backend / ai-service images.
  publish-frontend:
    name: Build & publish web frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Require the production API URL
        env:
          API_URL: ${{ vars.PRODUCTION_WEB_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable PRODUCTION_WEB_API_BASE_URL is not set (e.g. https://<domain>/api/v1). The web image would otherwise call http://localhost:8080 from users' browsers."
            exit 1
          fi
          case "$API_URL" in
            https://*/api/v1) ;;
            *) echo "::error::PRODUCTION_WEB_API_BASE_URL must look like https://<domain>/api/v1 (got: $API_URL)"; exit 1 ;;
          esac
          echo "FRONTEND_IMAGE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/frontend" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.flutter-web
          push: true
          build-args: |
            API_BASE_URL=${{ vars.PRODUCTION_WEB_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
