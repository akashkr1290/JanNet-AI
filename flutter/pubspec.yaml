name: jannet_ai
description: >
  JANNet AI citizen mobile app. Phase 6 (Complaint Module) is the first
  phase to add Flutter code - flutter/ held only a .gitkeep through
  Phase 5, by that phase's explicit, documented instruction (see
  PROJECT_PROGRESS.md's Phase 5 entry and ARCHITECTURE.md Section 9).
  This pubspec, main.dart, and the auth/complaint screens below are all
  new in Phase 6.
publish_to: 'none'
version: 0.6.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  # Already resolved (transitively, via http) - declared directly because
  # api_client.dart now sets each multipart part's MediaType explicitly.
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  intl: ^0.19.0
  # V33 incident location: OpenStreetMap map (free tiles, no API key) for the
  # mandatory "Where is the problem?" step, and its coordinate type.
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # V33: browser canvas re-encode of a photo picked at full size on Flutter Web
  # (the original is needed to read its EXIF location first).
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
