# nginx server for the Flutter Web release bundle (docker/Dockerfile.flutter-web).
# Serves on port 80 inside the container; Compose publishes it on the host as
# ${FLUTTER_WEB_PORT:-3000}. The app calls the Spring Boot API directly from the
# browser (API_BASE_URL baked in at build time) - this server only serves files.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Liveness endpoint for the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry files are not content-hashed by `flutter build web`: never cache them,
    # so a rebuilt image is picked up on the next page load.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.js|main\.dart\.wasm|main\.dart\.mjs|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static assets (fonts, images, CanvasKit) may be cached for a day.
    location ~* ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Single-page-app fallback: any path that is not a real file (e.g. /login,
    # /complaints/123 after a browser refresh) returns index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
