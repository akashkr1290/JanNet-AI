# JanNet AI - local/pilot orchestration (Phase 18)
#
# Run from the REPO ROOT (not from inside docker/). With `-f`, Compose looks
# for `.env` in the directory of THIS file (docker/), not the repo root, so
# pass the root .env explicitly - or use the root compose.yaml, which does:
#
#   cp .env.example .env   # fill in real secrets first - see .env's own header
#   docker compose --env-file .env -f docker/docker-compose.yml up --build
#   docker compose up --build            # same, via the root compose.yaml
#
# NOT VERIFIED: no Docker daemon in this workspace (see Dockerfile.backend's
# and Dockerfile.ai-service's own header comments) - never actually run.
# Validated only by manual review: YAML well-formedness (parsed with
# python's yaml.safe_load), cross-checked service env var names against
# application.yml/app/config.py, and cross-checked volume mount paths
# against LOCAL_STORAGE_PATH/YOLO_MODEL_PATH's container-side values in
# .env.example.

services:
  mysql:
    image: mysql:8.0
    container_name: jannet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Exposed to the host purely for local tooling (a MySQL client,
      # database/scripts/backup.sh|restore.sh run from the host rather
      # than `docker compose exec`) - not required for backend<->mysql
      # communication, which always uses the internal service network
      # below regardless of whether this port mapping exists.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jannet-network

  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-service
    container_name: jannet-ai-service
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      # Audit GAP-035: loopback only - the backend reaches ai-service over the
      # internal compose network; nothing outside this host should.
      - "127.0.0.1:8001:8001"
    # Audit GAP-015: no volume on /app/models any more. A named volume there
    # was populated from the image only once, so it kept stale content (or no
    # weights at all) after the image changed. The verified model is baked
    # into the image (Dockerfile.ai-service runs scripts/verify_model.py).
    # To try other weights locally, bind-mount a directory in a
    # docker-compose.override.yml instead.
    # No depends_on: ai-service is a standalone microservice with no
    # database of its own (app/config.py has no DB_* setting at all) -
    # it has nothing to wait for at startup.
    networks:
      - jannet-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: jannet-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Phase 6's StorageService local-disk stub (Section 5,
      # PROJECT_INTEGRATION.md) - persists uploaded complaint photos
      # across container recreations. Swapped for real AWS S3 in a future
      # phase per that same section's documented seam
      # (StorageService interface, no ComplaintService change needed).
      - backend_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - jannet-network
  # --------------------------------------------------------------------------
  # Flutter Web frontend - ALWAYS RUNNING (starts with `docker compose up -d`).
  # Multi-stage image: Flutter 3.47.1 builds the web release bundle, nginx
  # serves it on container port 80, published on http://localhost:${FLUTTER_WEB_PORT:-3000}.
  # The app runs in the user's browser, so FLUTTER_WEB_API_BASE_URL must be an
  # address the BROWSER can reach (the backend's published host port), not
  # http://backend:8080. It is compiled in: rebuild the image after changing it.
  # See docs/FLUTTER_DOCKER_SETUP.md.
  # --------------------------------------------------------------------------
  flutter-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.flutter-web
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.1}
        API_BASE_URL: ${FLUTTER_WEB_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: jannet-flutter-frontend
    restart: unless-stopped
    ports:
      - "${FLUTTER_WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - jannet-network

  # --------------------------------------------------------------------------
  # Flutter Android BUILD environment - ON DEMAND ONLY. The "android-build"
  # profile keeps it out of `docker compose up`; run it explicitly, e.g.
  #   docker compose run --rm flutter-android flutter build apk --release \
  #     --dart-define=API_BASE_URL=https://api.example.org/api/v1
  # The host's flutter/ directory is bind-mounted, so APK/AAB files appear in
  # flutter/build/app/outputs/ on the host. No emulator runs in this container.
  # --------------------------------------------------------------------------
  flutter-android:
    build:
      context: ..
      dockerfile: docker/Dockerfile.flutter-android
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.1}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    profiles: ["android-build"]
    working_dir: /workspace/flutter
    environment:
      # Allow http:// API URLs in release builds (local testing only; see docs).
      JANNET_ALLOW_CLEARTEXT: ${JANNET_ALLOW_CLEARTEXT:-false}
    volumes:
      - ../flutter:/workspace/flutter
      - flutter_pub_cache:/home/flutter/.pub-cache
      - flutter_gradle_cache:/home/flutter/.gradle


  # Gap-backlog Patch 23 (Sep 2026 audit): opt-in via the "shared-cache"
  # profile (`docker compose --profile shared-cache up`) - NOT part of the
  # default `docker compose up`, so nothing about the existing
  # single-instance setup changes unless explicitly requested.
  # AnalyticsCacheService's own header comment documents WHY it stayed
  # in-process rather than Redis-backed (ARCHITECTURE.md Section 7's
  # explicit non-goal, "unless a real, demonstrated technical requirement
  # forces it") - this service makes Redis available for that future
  # migration without forcing it now. NOT VERIFIED: no Docker daemon in
  # this workspace, same constraint every other service in this file
  # already documents.
  redis:
    image: redis:7-alpine
    container_name: jannet-redis
    restart: unless-stopped
    profiles: ["shared-cache"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jannet-network

volumes:
  mysql_data:
  backend_storage:
  redis_data:
  # Flutter Android build caches (pub packages, Gradle distribution/deps).
  flutter_pub_cache:
  flutter_gradle_cache:

networks:
  jannet-network:
    driver: bridge
