name = "jannet-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Workers cannot fetch bare IP addresses; sslip.io resolves a-b-c-d.sslip.io
# to a.b.c.d. HTTPS: nginx on the EC2 host has a publicly trusted certificate
# for this name. It must follow the EC2 public IP, which changes on every
# stop/start: deployment/scripts/pilot.sh sync-ip re-issues the certificate
# for the new name, then updates this line and redeploys the Worker.
ORIGIN_URL = "https://13-201-54-20.sslip.io"

# Secret (not in this file): PROXY_KEY - set by deployment/scripts/pilot.sh set-proxy-key
