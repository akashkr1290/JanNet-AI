# JanNet AI — Phase 22 nginx reverse proxy (TLS termination + routing to
# the backend container and, since audit fix Phase 07 / GAP-017, the Flutter
# web frontend container on 127.0.0.1:3000). __DOMAIN_NAME__ is substituted by
# ec2-user-data.sh.tpl's `sed` before this file is installed — never
# committed with a real domain baked in.
#
# certbot --nginx (run by ec2-user-data.sh.tpl) rewrites this file's TLS
# block in place on first successful certificate issuance — the `listen
# 443`/`ssl_certificate` lines below are what certbot itself would
# generate, written up front so nginx has a valid config to load even
# before certbot has run, and so a config-only redeploy is diffable
# against what certbot will produce. See ./README.md for the exact
# first-run sequence and its manual fallback if certbot fails.
#
# ai-service (port 8001) is intentionally NEVER proxied here — see
# ../aws/terraform/security_groups.tf's header comment: it is an
# internal-only microservice the backend calls server-to-server, never a
# citizen-facing endpoint.

server {
    listen 80;
    server_name __DOMAIN_NAME__;

    # ACME HTTP-01 challenge path — certbot needs plain HTTP here even
    # after the redirect below exists for everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` (not the newer `http2 on;`) works on nginx 1.24 and
    # later (1.25.1+ only logs a deprecation warning); `http2 on;` fails to
    # parse before 1.25.1. Checked with `nginx -t` on 1.24 (audit fix Phase 07).
    listen 443 ssl http2;
    server_name __DOMAIN_NAME__;

    # Populated by certbot --nginx on first successful run. Until then,
    # nginx will fail to start this server block — see ./README.md's
    # "First boot without a domain yet" fallback (serve HTTP-only from
    # the port-80 block above by commented-out-ing this block instead).
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem;

    # SRS 27.2: "All data in transit is encrypted via TLS 1.2+".
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Matches backend/src/main/resources/application.yml's own
    # spring.servlet.multipart.max-request-size (11MB) — kept in sync so
    # nginx never rejects a within-limit complaint-photo upload before it
    # even reaches the backend's own check.
    client_max_body_size 11M;

    location /actuator/health {
        # Liveness/readiness probing only — no auth header required,
        # matching Dockerfile.backend's own HEALTHCHECK usage of this
        # same unauthenticated path. Restrict to the load-balancer/
        # monitoring source in a future phase if this becomes a concern;
        # not treated as sensitive today (see application-prod.yml's
        # `show-details: never`, which already hides internal detail).
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audit GAP-041 (SRS 26/27 correlation ID): nginx's own per-request id,
        # which the backend adopts (RequestIdFilter), logs and returns in the
        # X-Request-Id response header, and forwards to ai-service.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Audit GAP-017 (SRS 11.1/11.2): the responsive web app. The container
    # (docker/Dockerfile.flutter-web, published by release-image-publish.yml)
    # serves the Flutter bundle with its own SPA fallback and cache headers;
    # its API_BASE_URL is https://<this domain>/api/v1, so browser calls come
    # back through the /api/v1/ location above on the same origin.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
