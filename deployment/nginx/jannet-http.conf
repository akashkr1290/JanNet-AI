# JanNet AI — plain-HTTP nginx config (audit fix Phase 07, GAP-017).
#
# Installed by ../scripts/ec2-user-data.sh.tpl in two situations:
#   1. First boot WITH a domain: nginx must already be running and answering
#      the ACME HTTP-01 challenge before a certificate exists, so this file is
#      installed first; after `certbot certonly --webroot` succeeds the script
#      replaces it with jannet.conf (HTTPS + HTTP->HTTPS redirect).
#      If certbot fails, this file stays in place (HTTP only) until the
#      operator re-runs certbot - see ./README.md.
#   2. No domain configured: the documented degraded mode (plain HTTP on the
#      instance's public IP, for demos only - SRS 27.2 requires TLS).
# Previously jannet.conf was installed directly; its 443 block references
# certificate files that do not exist yet, so nginx could not start and the
# bootstrap script (set -e) stopped before certbot ever ran.
#
# __DOMAIN_NAME__ is replaced by the bootstrap script (with "_" when there is
# no domain). Routing is identical to jannet.conf.

server {
    listen 80;
    server_name __DOMAIN_NAME__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 11M;

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
