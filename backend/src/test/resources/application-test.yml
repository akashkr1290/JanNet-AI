# Phase 20: test-only Spring profile ("test") backing @DataJpaTest and
# @SpringBootTest-based integration tests (ComplaintRepositoryTest,
# UserRepositoryTest, ComplaintWorkflowIntegrationTest). Activated via
# @ActiveProfiles("test") on those test classes, never used outside tests
# (application.yml's MySQL config remains the only profile used by
# `spring-boot:run` / the packaged jar / Docker Compose - see
# PROJECT_INTEGRATION.md Section 6, Phase 20 entry).
#
# Audit GAP-013 (2026-09-25): this profile previously used H2 in MySQL mode,
# which never ran the MySQL-specific migrations. It now uses real MySQL 8 -
# see the datasource block below.

spring:
  # Audit GAP-013: repository and context tests run against a real MySQL 8
  # (backend-ci.yml starts one as a service container). The migrations are
  # MySQL-specific and are verified on MySQL 8.0.46; H2 was never able to run
  # them. Override DB_* for a local run.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jannet_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:jannet_user}
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: localhost
    port: 587
    username:
    password:

app:
  name: jannet-ai-test
  jwt:
    secret: test-only-secret-key-at-least-32-bytes-long-for-hs256
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7
  bootstrap:
    super-admin:
      mobile-number:
      password:
      full-name: Test Super Admin
  storage:
    local-base-path: ./build/test-storage
  geo:
    municipal-min-latitude: 6.5
    municipal-max-latitude: 37.1
    municipal-min-longitude: 68.0
    municipal-max-longitude: 97.5
  complaint:
    max-submissions-per-24h: 10
    reopen-grace-period-days: 7
  ai-service:
    base-url: http://localhost:8001
    api-key: test-shared-secret
    # Disabled in every automated test - no ai-service instance is ever
    # actually running here; tests that need to observe the AI-triggered
    # side of the workflow mock AiClassificationService's HTTP client
    # directly rather than flipping this on (see
    # ComplaintWorkflowIntegrationTest's class Javadoc).
    enabled: false
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  duplicate-detection:
    candidate-window-days: 30
    max-candidates: 25
  department-assignment:
    fallback-department-name: General Triage
  budget:
    approval-threshold-inr: 50000
  escalation:
    sla-hours:
      critical: 24
      high: 72
      medium: 168
      low: 336
    sweep-interval-ms: 900000
  notification:
    email:
      enabled: false
      from-address: no-reply@jannetai.local
    sms:
      enabled: false
      provider-url:
      provider-api-key:
    async-enabled: false # Gap-backlog Patch 17: tests assert synchronous delivery
    max-delivery-attempts: 3
    retry-backoff-base-ms: 200
  analytics:
    aggregation-cron: 0 0 2 * * *
